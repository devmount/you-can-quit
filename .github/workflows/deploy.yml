# This workflow will do a clean install of node dependencies,
# build the application and deploy it to production
# when a new version (git tag) is released

name: Build & Deploy

on:
  push:
    tags:
      - '*'

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Build app
      run: |
        pnpm install --frozen-lockfile
        pnpm build
    - name: Push Build files to production
      uses: burnett01/rsync-deployments@9.0.0
      with:
        switches: -avzr --delete
        path: dist/
        remote_path: ${{ secrets.DEPLOY_PATH }}
        remote_host: ${{ secrets.DEPLOY_HOST }}
        remote_port: ${{ secrets.DEPLOY_PORT }}
        remote_user: ${{ secrets.DEPLOY_USER }}
        remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
        remote_key_pass: ${{ secrets.DEPLOY_SSH_PHRASE }}
